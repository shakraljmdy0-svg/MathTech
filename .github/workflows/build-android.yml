name: Build MathTech APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      # ===== تحميل SDK يدوياً =====
      - name: Download Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-9477386_latest.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # ===== قبول التراخيص يدوياً (هذا يحل مشكلة build-tools 37) =====
      - name: Accept all licenses
        run: |
          mkdir -p $HOME/android-sdk/licenses
          for f in android-sdk-license android-sdk-preview-license android-googletv-license android-sdk-arm-dbt-license google-gdk-license mips-android-sysimage-license; do
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/android-sdk/licenses/$f
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/android-sdk/licenses/$f
            echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> $HOME/android-sdk/licenses/$f
            echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $HOME/android-sdk/licenses/$f
          done

      # ===== تثبيت كل حزم SDK =====
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          sdkmanager --list_installed

      # ===== تثبيت Buildozer =====
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # ===== إعداد buildozer.spec =====
      - name: Configure buildozer.spec
        run: |
          sed -i 's|^# android.sdk_path =.*|android.sdk_path = /home/runner/android-sdk|' buildozer.spec || true
          sed -i 's|^android.sdk_path =.*|android.sdk_path = /home/runner/android-sdk|' buildozer.spec || true
          grep -q "android.sdk_path" buildozer.spec || echo "android.sdk_path = /home/runner/android-sdk" >> buildozer.spec
          echo "ANDROIDSDK=/home/runner/android-sdk" >> $GITHUB_ENV
          echo "ANDROIDNDK=/home/runner/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV

      # ===== البناء =====
      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MathTech-APK
          path: bin/*.apk