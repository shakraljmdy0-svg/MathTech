name: Build MathTech APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROIDSDK: /home/runner/android-sdk
      ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/25.2.9519653
      ANDROIDNDK: /home/runner/android-sdk/ndk/25.2.9519653
      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      # ============================================================
      # تثبيت SDK + كل build-tools الحديثة
      # ============================================================
      - name: Setup Android SDK (Buildozer compatible layout)
        run: |
          SDK=/home/runner/android-sdk
          mkdir -p $SDK/cmdline-tools
          mkdir -p $SDK/tools/bin
          mkdir -p $SDK/licenses

          cd $SDK/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-9477386_latest.zip

          # روابط رمزية
          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          ln -sf $SDK/cmdline-tools/latest/bin/avdmanager $SDK/tools/bin/avdmanager

          # قبول التراخيص
          for f in android-sdk-license android-sdk-preview-license android-googletv-license android-sdk-arm-dbt-license google-gdk-license mips-android-sysimage-license; do
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK/licenses/$f
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/$f
            echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> $SDK/licenses/$f
            echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $SDK/licenses/$f
          done

          export PATH=$SDK/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true

          # تثبيت كل build-tools الحديثة المهمة
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          sdkmanager --list_installed

          echo "=== التحقق من aidl في build-tools;33.0.2 ==="
          ls -la $SDK/build-tools/33.0.2/aidl
          echo "=== محتوى build-tools ==="
          ls -la $SDK/build-tools/

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MathTech-APK
          path: bin/*.apk